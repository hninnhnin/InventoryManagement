<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h2 class="text-dark fw-bold mb-0">
            <i class="bi bi-speedometer2 text-primary me-2"></i>လုပ်ငန်းသုံး Dashboard
        </h2>
        <a href="index.html" class="btn btn-outline-primary d-flex align-items-center gap-2 shadow-sm fw-bold">
            <i class="bi bi-house-door-fill"></i>
            ပင်မစာမျက်နှာသို့ ပြန်ရန်
        </a>
    </div>

    <div id="alertContainer" class="alert alert-warning d-none shadow-sm mb-4" role="alert">
        <span id="alertMessage"></span>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-success text-white text-center p-4 shadow-sm border-0">
                <h5>🔥 ယခုလ အရောင်းရဆုံးပစ္စည်း</h5>
                <h2 id="topItemName" class="fw-bold">Loading...</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-warning text-dark text-center p-4 shadow-sm border-0">
                <h5>⚠️ လက်ကျန်နည်းနေသော ပစ္စည်းများ</h5>
                <h2 id="lowStockCount" class="fw-bold">Loading...</h2>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-danger text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>အရစ်ကျ ငွေပေးချေရန် ရက်ကျော်နေသူများ စာရင်း</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">ဝယ်သူအမည်</th>
                        <th>ဗောက်ချာနံပါတ်</th>
                        <th>ပေးရမည့်ရက်</th>
                        <th class="text-end pe-3">ပေးရန်ကျန်ငွေ (MMK)</th>
                    </tr>
                    </thead>
                    <tbody id="overdueTableBody">
                    <tr><td colspan="4" class="text-center py-4 text-muted">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadDashboardData() {
        try {
            const currentMonth = new Date().getMonth() + 1;
            const currentYear = new Date().getFullYear();

            const response = await fetch(`/api/dashboard/summary?month=${currentMonth}&year=${currentYear}`);
            if (!response.ok) throw new Error("ဒေတာဆွဲယူ၍ မရပါ");

            const data = await response.json();

            document.getElementById('topItemName').innerText = data.topSellingItem || "မရှိသေးပါ";

            const alertContainer = document.getElementById('alertContainer');
            const alertMessage = document.getElementById('alertMessage');
            const lowStockCountElement = document.getElementById('lowStockCount');

            if (data.lowStockItems && data.lowStockItems.length > 0) {
                const itemNames = data.lowStockItems.join(", ");
                alertMessage.innerText = `⚠️ လက်ကျန် (၅) ခုအောက် နည်းနေသောပစ္စည်းများ - [ ${itemNames} ] ရှိနေပါသည်။ ကျေးဇူးပြု၍ ပစ္စည်းဖြည့်တင်းပေးပါရန်။`;
                alertContainer.classList.remove('d-none');
                lowStockCountElement.innerText = `${data.lowStockItems.length} မျိုး`;
            } else {
                alertContainer.classList.add('d-none');
                lowStockCountElement.innerText = "၀ မျိုး";
            }

            const tableBody = document.getElementById('overdueTableBody');
            tableBody.innerHTML = '';

            if (!data.overdueInstallments || data.overdueInstallments.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-success fw-bold py-4">🎉 ရက်ကျော်နေသော အကြွေးစာရင်း လုံးဝမရှိပါ။</td></tr>`;
                return;
            }

            data.overdueInstallments.forEach(item => {
                const row = `
                <tr class="table-danger">
                    <td class="fw-bold ps-3">${item.customerName}</td>
                    <td><span class="badge bg-secondary">${item.invoiceNumber}</span></td>
                    <td class="text-danger fw-bold">${item.dueDate}</td>
                    <td class="text-end fw-bold text-dark pe-3">${Number(item.amountDue).toLocaleString()} MMK</td>
                </tr>
            `;
                tableBody.innerHTML += row;
            });

        } catch (err) {
            console.error(err);
            document.getElementById('overdueTableBody').innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">ဒေတာဆွဲယူရာတွင် အမှားရှိနေပါသည် - ${err.message}</td></tr>`;
        }
    }

    document.addEventListener("DOMContentLoaded", loadDashboardData);
</script>
</body>
</html>
